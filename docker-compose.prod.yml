version: "3.8"

services:
  aptd:
    image: penikolov23/adastra-python-task-dockerized
    networks:
      - prod-net
    environment: 
      - TERM=xterm-color
      - APTD__ENV=PROD
      - APTD__DATASOURCE=1
      - APTD__DATASINK=1\n(prod console)::key:{} | value:{} | ts:{}
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: "0.5"
          memory: 100M


