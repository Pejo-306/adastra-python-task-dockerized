version: "3.8"

x-args: &aptd_service_common
  image: penikolov23/adastra-python-task-dockerized
  networks:
    - prod-net

services:
  aptd:
    <<: *aptd_service_common  
    environment: 
      - TERM=xterm-color
      - APTD__ENV=PROD
      - APTD__DATASOURCE=1
      - APTD__DATASINK=1\n(prod console)::key:{} | value:{} | ts:{}
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: "0.5"
          memory: 100M

  aptd-postgresink:
    <<: *aptd_service_common  
    extra_hosts: 
      - "host.docker.internal:host-gateway"
    environment: 
      - APTD__ENV=PROD
      - APTD__DATASOURCE=1
      - APTD__DATASINK=2\ndefault_schema\nuser\nuser\nhost.docker.internal\n5432
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 75M

  postgres-db:
    image: postgres
    env_file:
      - database.env
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 100M
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - prod-net

networks:
  prod-net:
      
volumes:
  postgres_prod_data:
